<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — BIT Notebook, Mid-Valley International College</title>
<meta name="description" content="Get in touch with Mid-Valley International College about the BIT programme.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='6' y='6' width='28' height='28' rx='3' fill='none' stroke='%232C5F6F' stroke-width='2'/%3E%3Cpath d='M14 14h12v12H14z' fill='%23C97B2E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">

<a href="#main" class="skip-link">Skip to content</a>
<div class="paper-grain" aria-hidden="true"></div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
<div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
<div class="ink-transition" id="inkTransition" aria-hidden="true"></div>

<nav class="spine" aria-label="Notebook navigation">
  <div class="spine-mark" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M13 13h14v14H13z" fill="currentColor"/></svg>
    <span>notebook</span>
  </div>
  <button class="spine-tab" data-nav="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button class="spine-tab" data-nav="about.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
    <span>About</span>
  </button>
  <button class="spine-tab" data-nav="courses.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Courses</span>
  </button>
  <button class="spine-tab is-current" data-nav="contact.html" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
    <span>Contact</span>
  </button>
  <span class="spine-foot">gyaneshwor &middot; ktm</span>
</nav>

<main id="main" class="book-page contact-page">
  <div class="postcard-shell">
    <form id="contactForm" novalidate>
      <div class="content-head">
        <div>
          <span class="eyebrow mono">page four</span>
          <h2>Drop a note, we'll write back</h2>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Your name">
          <span class="field-error" id="err-fullName"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <span class="field-error" id="err-email"></span>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="98XXXXXXXX">
          <span class="field-error" id="err-phone"></span>
        </div>
        <div class="field">
          <label for="subject">About</label>
          <input type="text" id="subject" name="subject" placeholder="Admissions, scholarships…">
        </div>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="3" placeholder="What do you want to know?"></textarea>
        <span class="field-error" id="err-message"></span>
      </div>
      <button type="submit" class="stamp-btn"><span>Send the postcard</span></button>
      <p class="field-success" id="formSuccess">Sent — replies usually land within a day.</p>
    </form>

    <div class="contact-side">
      <div class="fact-card"><h4>Address</h4><p>Gyaneshwor, Kathmandu, Nepal</p></div>
      <div class="fact-card"><h4>Phone</h4><p>+977 1-4412345</p></div>
      <div class="fact-card"><h4>Email</h4><p>info@midvalleycollege.edu.np</p></div>
      <div class="fact-card"><h4>Hours</h4><p>Sun–Fri, 6:00 AM – 5:00 PM</p></div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
